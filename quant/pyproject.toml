[project]
name = "flowolf-quant"
version = "0.1.0"
description = "Flowolf's own quant library: regimes, allocation, selection, risk and the validation gate."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flowolf_quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
